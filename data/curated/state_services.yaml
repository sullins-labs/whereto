# What a state hands back. Only services a household would otherwise buy
# privately are listed: roads, parks and public safety are real and valuable
# but are not an avoided invoice, and counting them would let this file be
# tuned to any conclusion.
#
# One field is deliberately zero everywhere. See review_notes; it is a gap that
# is declared rather than filled with plausible numbers.
meta:
  as_of: 2026-01-01
  reviewed_by: manual
  sources:
    - "NIEER, The State of Preschool 2024 yearbook, percent of 4-year-olds enrolled in state-funded preschool, 2023-24 school year"
    - "NCES/IPEDS via Education Data Initiative, average published in-state tuition and fees, public four-year, AY 2025-26"
    - "KFF, status of state action on the Medicaid expansion decision"
    - "State statutes establishing paid family and medical leave programs"
    - "NASSGAP, 55th Annual Survey Report on State-Sponsored Student Financial Aid, Table 12, estimated undergraduate grant dollars per undergraduate FTE, 2023-24"
  review_notes: >-
    prek_coverage_pct and tuition_instate are transcribed from the two tables
    named above and cover all 51 jurisdictions at one vintage each.
    medicaid_expansion and paid_family_leave are binary facts about statute.
    Paid leave is recorded as whether benefits are actually payable during
    2026, not whether a law has been passed, because a program still phasing
    in pays a household nothing. Maryland has enacted a program whose
    benefits do not begin in 2026, so it is recorded false.

    grant_aid_per_student comes from NASSGAP Table 12, which already divides
    each state's undergraduate grant spending by its IPEDS undergraduate FTE,
    so it is a published ratio rather than one computed here. It is the one
    figure in this file on a different vintage: 2023-24, from the most recent
    survey published, where tuition is 2025-26. Grant programs move slowly
    enough that mixing them is defensible, and saying so is cheaper than
    pretending they match. Wyoming reports none, which is why it is 0.

    That ordering is worth a glance before trusting the file: New Mexico,
    Georgia and South Carolina lead, and Utah, New Hampshire and Montana are
    close to nothing. An earlier draft of this file guessed these values and
    put California above Washington, which the survey contradicts.

    senior_property_relief_pct is zero for every state, and that is a decision
    rather than an oversight. Every state offers something,
    but the programs are income-tested at thresholds low enough that the
    typical retired household in this model may not qualify at all
    (Pennsylvania cuts off at $35,000, Utah at $44,221), and they are
    structured four different ways. A single fraction per state would misstate
    both who qualifies and by how much. The mechanism that consumes it has
    been corrected in the meantime, so the numbers can be filled in later
    without touching the model.

