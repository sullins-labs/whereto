# What a state hands back. Only services a household would otherwise buy
# privately are listed: roads, parks and public safety are real and valuable
# but are not an avoided invoice, and counting them would let this file be
# tuned to any conclusion.
#
# Two fields are deliberately zero everywhere. See review_notes; they are gaps
# that are declared rather than filled with plausible numbers.
meta:
  as_of: 2026-01-01
  reviewed_by: manual
  sources:
    - "NIEER, The State of Preschool 2024 yearbook, percent of 4-year-olds enrolled in state-funded preschool, 2023-24 school year"
    - "NCES/IPEDS via Education Data Initiative, average published in-state tuition and fees, public four-year, AY 2025-26"
    - "KFF, status of state action on the Medicaid expansion decision"
    - "State statutes establishing paid family and medical leave programmes"
  review_notes: >-
    prek_coverage_pct and tuition_instate are transcribed from the two tables
    named above and cover all 51 jurisdictions at one vintage each.
    medicaid_expansion and paid_family_leave are binary facts about statute.
    Paid leave is recorded as whether benefits are actually payable during
    2026, not whether a law has been passed, because a programme still phasing
    in pays a household nothing. Maryland has enacted a programme whose
    benefits do not begin in 2026, so it is recorded false.

    grant_aid_per_student and senior_property_relief_pct are zero for every
    state, and that is a decision rather than an oversight.

    State grant aid per student would need NASSGAP's survey read state by
    state. Filling in only the states with famous programmes would be worse
    than filling in none: this tool compares places, so a bias applied evenly
    cancels out and a bias applied to the states someone happened to remember
    does not.

    Senior property tax relief is worse still. Every state offers something,
    but the programmes are income-tested at thresholds low enough that the
    typical retired household in this model may not qualify at all
    (Pennsylvania cuts off at $35,000, Utah at $44,221), and they are
    structured four different ways. A single fraction per state would misstate
    both who qualifies and by how much. The mechanism that consumes it has
    been corrected in the meantime, so the numbers can be filled in later
    without touching the model.

