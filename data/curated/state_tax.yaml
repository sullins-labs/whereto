    income_flat: false
    sales_combined: 8.99
    retire_code: 2
    note: >-
      Proposition 13 caps assessment growth, so long-tenured owners pay far
      less than recent buyers on an identical house. County effective rates now
      come from ACS and still describe the average of both, so a recent buyer
      should read the property figure as optimistic.
