# State tax treatment. This is statute, not data: nobody publishes a
# machine-readable feed of "does this state tax Social Security", so it is
# maintained by hand, reviewed annually, and versioned like code.
#
# Every field carries an as_of date and a source. A value without both is a
# guess wearing a number's clothing, and validate.py rejects it.
#
# property_effective used to live here as one rate per state. It has moved to
# the ACS extractor, which divides median real estate taxes paid by median home
# value per county. It was always an empirical measurement rather than statute,
# and a single state figure hid the variation that matters: New Jersey counties
# run from roughly 1.8% to 3%, and a household picking between two of them was
# shown the same number for both.
#
# retire_code:
#   0  no state income tax at all
#   1  exempts Social Security and most other retirement income
#   2  exempts Social Security, taxes withdrawals and pensions
#   3  taxes withdrawals and part of Social Security
meta:
  as_of: 2026-01-01
  reviewed_by: manual
  sources:
    - "Tax Foundation, State Individual Income Tax Rates and Brackets, tax year 2025"
    - "Tax Foundation, State and Local Sales Tax Rates, 1 January 2026 (state rate plus population-weighted average local rate)"
    - "State departments of revenue, tax year 2025 schedules"
    - "NCSL, State Tax Treatment of Retirement Income"
  review_notes: >-
    income_top_rate, income_flat and sales_combined are transcribed from the
    Tax Foundation tables named above and are the most checkable values here.
    retire_code is a judgement that compresses a whole statute into one digit,
    so it is the field most worth arguing with. The eight states coded 3 are
    those still taxing Social Security in some form in tax year 2026; West
    Virginia finished phasing its tax out and is coded 2 rather than 3.
    Washington levies a capital gains tax but no tax on wage or retirement
    income, so income_top_rate is 0 for the household this model describes.

states:
  AL:
    income_top_rate: 5.00
    income_flat: false
    sales_combined: 9.46
    retire_code: 2
  AK:
    income_top_rate: 0.0
    income_flat: false
    sales_combined: 1.82
    retire_code: 0
    note: >-
      No state income tax and no state sales tax; the rate shown is local only
      and is the lowest in the country. Alaska also pays a dividend, which this
      model does not count because it is not a tax treatment.
  AZ:
    income_top_rate: 2.50
