    sales_combined: 6.00
    retire_code: 2
  LA:
    income_top_rate: 3.00
    income_flat: true
    sales_combined: 10.11
    retire_code: 2
    note: >-
      The highest combined sales tax in the country, against one of the lower
      flat income rates. The burden is shifted toward what a household spends
      rather than what it earns.
  ME:
    income_top_rate: 7.15
